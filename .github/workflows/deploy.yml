name: CI/CD

on:
  push:
    branches:
      - prod

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: AI service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: AI service tests
        working-directory: ai-service
        run: pytest -q

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-backend:latest

      - name: Build and push AI service
        uses: docker/build-push-action@v7
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-ai:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-ai:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME
          script: |
            set -e

            cd /opt/pcp

            echo "Fetching secrets from AWS Secrets Manager..."

            aws secretsmanager get-secret-value \
              --secret-id pcp \
              --query SecretString \
              --output text |
            python3 -c '
            import json
            import shlex
            import sys

            data = json.load(sys.stdin)

            with open(".env.production", "w") as f:
                for key, value in data.items():
                    f.write(f"{key}={shlex.quote(str(value))}\n")
            '

            chmod 600 .env.production

            # Load Secrets Manager values into the shell
            set -a
            source .env.production
            set +a

            export IMAGE_TAG="${IMAGE_TAG}"
            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"

            echo "Pulling Docker images..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              pull

            echo "Running database migrations..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              run --rm --no-deps backend npm run migrate

            echo "Starting production services..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              up -d

            echo "Waiting for services..."

            sleep 15

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              ps

            echo "Checking application through Nginx..."

            curl --fail http://localhost/api/health

            echo "Checking AI service..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              exec -T ai-service \
              python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"

            echo "Deployment successful."