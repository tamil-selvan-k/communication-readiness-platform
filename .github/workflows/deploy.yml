name: CI/CD

on:
  push:
    branches:
      - prod

permissions:
  contents: read

jobs:

  # ============================================================
  # TEST
  # ============================================================

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      # -----------------------------
      # Backend
      # -----------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend build
        working-directory: backend
        run: npm run build

      # -----------------------------
      # AI Service
      # -----------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: AI service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: AI service tests
        working-directory: ai-service
        run: pytest -q


  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================

  build-and-push:
    name: Build and Push Docker Images

    needs: test

    # Native ARM64 GitHub-hosted runner.
    # EC2 is AWS Graviton ARM64.
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      # -----------------------------
      # Docker Hub login
      # -----------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------
      # Docker Buildx
      # -----------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # -----------------------------
      # Backend
      # -----------------------------

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-backend:latest

      # -----------------------------
      # AI Service
      # -----------------------------

      - name: Build and push AI service
        uses: docker/build-push-action@v7
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-ai:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-ai:latest

      # -----------------------------
      # Frontend
      # -----------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/communication-readiness-frontend:latest

  # ============================================================
  # DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy
        uses: appleboy/ssh-action@v1

        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME

          script: |

            set -e

            echo "=========================================="
            echo "Starting deployment"
            echo "=========================================="

            cd /opt/pcp


            # ==================================================
            # FETCH SECRETS FROM AWS SECRETS MANAGER
            # ==================================================

            echo "Fetching secrets from AWS Secrets Manager..."

            aws secretsmanager get-secret-value \
              --secret-id pcp \
              --query SecretString \
              --output text |
            python3 -c '
            import json
            import shlex
            import sys

            data = json.load(sys.stdin)

            with open(".env.production", "w") as f:
                for key, value in data.items():
                    f.write(f"{key}={shlex.quote(str(value))}\n")
            '

            chmod 600 .env.production


            # ==================================================
            # LOAD ENVIRONMENT VARIABLES
            # ==================================================

            set -a
            source .env.production
            set +a

            export IMAGE_TAG="${IMAGE_TAG}"
            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"


            # ==================================================
            # DEPLOYMENT INFORMATION
            # ==================================================

            echo "Deploying commit:"
            echo "${IMAGE_TAG}"

            echo "Docker Hub user:"
            echo "${DOCKERHUB_USERNAME}"


            # ==================================================
            # PULL NEW IMAGES
            # ==================================================

            echo "Pulling Docker images..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              pull


            # ==================================================
            # DATABASE MIGRATIONS
            # ==================================================

            echo "Running database migrations..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              run \
              --rm \
              --no-deps \
              backend \
              npm run migrate


            # ==================================================
            # START / UPDATE SERVICES
            # ==================================================

            echo "Starting production services..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              up -d


            # ==================================================
            # WAIT FOR SERVICES
            # ==================================================

            echo "Waiting for services..."

            sleep 15


            # ==================================================
            # SERVICE STATUS
            # ==================================================

            echo "Service status:"

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              ps


            # ==================================================
            # FRONTEND HEALTH CHECK
            # ==================================================

            echo "Checking frontend..."

            curl \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              http://localhost:80

            # ==================================================
            # BACKEND HEALTH CHECK
            # ==================================================

            echo "Checking backend..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              exec -T \
              backend \
              node -e \
              "require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"


            # ==================================================
            # AI SERVICE HEALTH CHECK
            # ==================================================

            echo "Checking AI service..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              exec -T \
              ai-service \
              python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"


            # ==================================================
            # REDIS HEALTH CHECK
            # ==================================================

            echo "Checking Redis..."

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.production \
              exec -T \
              redis \
              redis-cli \
              -a "${REDIS_PASSWORD}" \
              ping


            # ==================================================
            # RUNNING CONTAINERS
            # ==================================================

            echo "Running containers:"

            docker ps


            # ==================================================
            # CLEAN UNUSED IMAGES
            # ==================================================

            echo "Cleaning unused Docker images..."

            docker image prune -af


            # ==================================================
            # DISK USAGE
            # ==================================================

            echo "Disk usage:"

            df -h /

            echo "Docker disk usage:"

            docker system df


            # ==================================================
            # SUCCESS
            # ==================================================

            echo "=========================================="
            echo "Deployment successful"
            echo "Commit: ${IMAGE_TAG}"
            echo "=========================================="
